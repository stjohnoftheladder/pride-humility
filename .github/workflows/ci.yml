name: CI

# One pipeline, two jobs: the suite runs first, and the deploy cannot start
# until it passes (`needs: test`). This is deliberate — a red suite must not be
# able to reach production, which the previous split (ci.yml + deploy.yml, both
# firing independently on a push to main) allowed.
#
# Two branches deploy, and they are not the same thing:
#   main -> the production site (pride-humility.pages.dev)
#   dev  -> a preview alias of its own (dev.pride-humility.pages.dev), for work
#           that is not ready for players yet
# Both are gated on the suite, so neither can publish a red build.
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the Playwright suite (both journeys, endings, input, bullets)
        run: npm test

  deploy:
    name: Deploy to Cloudflare Pages
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    # Serialise each branch's deploys; queue rather than cancel so an older
    # commit can never land on top of a newer one.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --branch decides where it lands: `main` is production, any other name
        # is a preview alias, so the dev branch publishes to dev.pride-humility.pages.dev
        run: npx wrangler pages deploy dist --project-name pride-humility --branch ${{ github.ref_name }}

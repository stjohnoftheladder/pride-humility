name: CI

# One pipeline, two jobs: the suite runs first, and the deploy cannot start
# until it passes (`needs: test`). A red suite must not be able to reach the
# live site.
#
# FOR NOW the dev branch is what publishes. Nobody is playing the live build
# yet, and the point is one link that always carries the newest build with the
# dev tools already on: a push to `dev` runs the suite and, if it passes,
# deploys to the production URL (wrangler `--branch main`) built with
# VITE_DEBUG_DEFAULT=1 — the same mode `?debug` switches on locally, so the dev
# panel, the travel keys and the approach cards are there without a query
# string.
#
# When this is ready for players: point `on.push.branches` at `main`, drop the
# VITE_DEBUG_DEFAULT line, and dev goes back to being a branch nobody deploys.
on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the Playwright suite (both journeys, endings, input, bullets)
        run: npm test

  deploy:
    name: Deploy to Cloudflare Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    # Serialise deploys; queue rather than cancel so an older commit can never
    # land on top of a newer one.
    concurrency:
      group: deploy-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the dev build (dev tools on)
        run: npm run build
        env:
          VITE_DEBUG_DEFAULT: '1'
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --branch main publishes this build as the live site, so
        # pride-humility.pages.dev serves the dev build for now.
        run: npx wrangler pages deploy dist --project-name pride-humility --branch main
